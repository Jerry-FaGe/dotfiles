# Yazi 最小实用配置。
# 目标是先把浏览、预览、搜索和编辑器联动调顺，不堆插件。

[mgr]
# 三栏布局：左侧父目录、中间当前目录、右侧预览。
ratio = [1, 3, 4]

# 自然排序 + 文件夹优先，更符合日常开发目录的浏览习惯。
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true

# 在列表右侧显示大小信息，便于快速判断文件体量。
linemode = "size"

# 默认仍然不显示隐藏文件，但会在 keymap 里给出快速切换键。
show_hidden = false

# 显示符号链接目标，避免在 node/python 工程里看不清链接指向。
show_symlink = true

# 滚动时保留上下文，浏览大目录更稳。
scrolloff = 8

# 保留最常用的鼠标事件：点击与滚轮。
mouse_events = ["click", "scroll"]

# 让终端标题跟着当前目录变化，切多个标签页时更容易辨认。
title_format = "Yazi: {cwd}"

[preview]
# 代码预览默认不自动换行，避免长行代码被折断后难读。
wrap = "no"
tab_size = 2

# 这台机子主要是开发场景，图片缓存尺寸不需要拉太大。
max_width = 1600
max_height = 1600
image_delay = 30
image_filter = "triangle"
image_quality = 75

[tasks]
# 隐藏系统预加载任务，任务列表更干净。
suppress_preload = true

[opener]
# 文本文件统一走编辑器，保持和 shell 里的 EDITOR 一致。
edit = [
  { run = '$EDITOR "%s"', block = true, for = "unix" },
]

[open]
# 常见开发文件优先用编辑器打开。
prepend_rules = [
  { url = "*.{md,txt,log,conf,ini,toml,yaml,yml,json,env,py,js,ts,tsx,jsx,rs,go,c,cpp,h,hpp,java,sh,zsh,bash}", use = "edit" },
]
