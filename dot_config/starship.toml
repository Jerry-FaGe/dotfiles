# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$java\
$python\
$nodejs\
$c\
$bun\
$dotnet\
$deno\
$sudo\
$username\
$shell\
$memory_usage\
$hostname\
$time\
$line_break\
$character\
"""

[character]
format = '$symbol '
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"

[os]
format = '[$symbol ]($style)'
style = 'bold #DD4814'
disabled = false

[username]
format = '[ ](bold 248)[$user]($style) '
style_user = 'bold yellow'
style_root = 'bold red'
show_always = true
disabled = false

[hostname]
format = '[$ssh_symbol]($style)[$hostname](bold bright-cyan) '
ssh_symbol = " "
style = 'bold 248 green'
ssh_only = true
trim_at = ''
aliases = { "loganmac.local" = "mac" }
disabled = true

[cmd_duration]
format = '[](bright-red) [$duration]($style) '
style = 'bold yellow'
min_time = 2000
show_milliseconds = false

[aws]
format = '[$symbol](bold green)[( $profile)]($style) '
symbol = ' '
style = 'bright-purple'
disabled = true

[buf]
symbol = " "

[bun]
format = '[ ](bold green)[$symbol($version)]($style) '
symbol = 'Bun'
style = 'bright-purple'
detect_files = ['bun.lockb', 'bunfig.toml']
version_format = '${major}.${minor}'
disabled = true

[c]
format = '[ ](bold green)[$symbol]($style)[$version(\($name\))]($style) '
symbol = " "
style = 'bright-purple'
detect_extensions = ['c', 'h']
version_format = '${major}.${minor}'
disabled = false

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
format = '[ ](bold green)[$symbol($version)]($style) '
symbol = 'Deno'
style = 'bright-purple'
detect_files = ['deno.json', 'deno.jsonc', 'deno.lock', 'mod.ts', 'mod.js', 'deps.ts', 'deps.js']
version_format = '${major}.${minor}'
disabled = true

[directory]
format = '[ $path]($style)[$read_only]($read_only_style) '
style = 'bold bright-cyan'
read_only_style = 'red'
home_symbol = "~"
truncation_symbol = '…/'
truncation_length = 3
read_only = " 󰌾"
use_os_path_sep = true
truncate_to_repo = true

[docker_context]
symbol = " "

[dotnet]
format = '[ ](bold green)[$symbol($version)(\($tfm\))]($style) '
symbol = '.NET'
style = 'bright-purple'
detect_extensions = ['csproj', 'fsproj', 'xproj']
detect_files = ['global.json', 'project.json', 'Directory.Build.props', 'Directory.Build.targets', 'Packages.props']
version_format = '${major}.${minor}'
disabled = true

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fill]
symbol = ' '
style = 'bright-black'
disabled = false

[fossil_branch]
symbol = " "

[git_branch]
format = """
[$symbol$branch]($style)\
[(:$remote_name/$remote_branch)]($style)\
"""
symbol = " "
style = 'bold purple'
always_show_remote = false
disabled = false

[git_commit]
tag_symbol = '  '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style)) '
style = 'bold red'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[java]
format = '[ ](bold green)[${symbol}(${version} )]($style)'
symbol = " "
style = 'bright-purple'
detect_extensions = ['java', 'class', 'gradle', 'jar', 'cljs', 'cljc']
detect_files = ['pom.xml', 'build.gradle.kts', 'build.sbt', '.java-version', 'deps.edn', 'project.clj', 'build.boot', '.sdkmanrc']
version_format = '${major}.${minor}'
disabled = false

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
threshold = 75
format = '$symbol [${ram_pct}(|${swap_pct})]($style) '
symbol = "󰍛"
disabled = false

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[nodejs]
format = '[ ](bold green)[$symbol($version)]($style) '
symbol = " "
style = 'bright-purple'
detect_files = ['package.json', '.node-version', '.nvmrc']
detect_folders = ['node_modules']
not_capable_style = 'red'
version_format = '${major}.${minor}'
disabled = false

[ocaml]
symbol = " "

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[pijul_channel]
symbol = " "

[python]
format = '[${symbol} ${pyenv_prefix}(${version})(\($virtualenv\))]($style) '
symbol = '󰌠'
style = 'bright-purple'
version_format = '${raw}'
pyenv_version_name = false
disabled = false

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = "󱘗 "

[scala]
symbol = " "

[shell]
format = '[ ](bold 248)[$indicator]($style) '
style = 'bold bright-blue'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
bash_indicator = 'bash'
zsh_indicator = 'zsh'
disabled = false

[status]
format = '$symbol'
symbol = '[●\($status\)](bright-red) '
success_symbol = '[●](green) '
not_executable_symbol = '[⌽\($status\)](bright-red) '
not_found_symbol = '[◎\($status\)](bright-red) '
sigint_symbol = '[✶\($status\)](bright-red) '
signal_symbol = '[✕\($status\)](bright-red) '
recognize_signal_code = true
map_symbol = true
disabled = false

[sudo]
format = '[$symbol]($style) '
symbol = ''
style = 'bold 9'
allow_windows = false
disabled = false

[swift]
symbol = " "

[time]
format = '[ ](bold 248)[$time]($style)'
style = 'bold bright-cyan'
time_format = '%H:%M'
use_12hr = false
disabled = false

[zig]
symbol = " "

[gradle]
symbol = " "
